apiVersion: v1
kind: ServiceAccount
metadata:
  name: tasky
  namespace: tasky
---
# =============================================================================
# >>> INTENTIONAL WEAKNESS <<<
# The exercise requires the container application to hold a cluster-wide
# Kubernetes admin role. This binds the app's ServiceAccount to the built-in
# cluster-admin ClusterRole.
#
# Consequence to explain in the presentation: any remote-code-execution flaw in
# a public-facing todo app becomes full control of the cluster. The pod's
# projected service-account token can read every Secret in every namespace,
# create privileged pods, and mount the host filesystem - so a web-tier bug
# escalates straight to cluster takeover, and from there to the node identity.
#
# Demonstrate live:
#   kubectl auth can-i --list --as=system:serviceaccount:tasky:tasky
#   kubectl auth can-i create pods --all-namespaces \
#     --as=system:serviceaccount:tasky:tasky
# =============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tasky-cluster-admin-INTENTIONAL-WEAKNESS
  labels:
    exercise-weakness: "cluster-admin-serviceaccount"
subjects:
  - kind: ServiceAccount
    name: tasky
    namespace: tasky
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
